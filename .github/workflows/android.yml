name: Android APK 云构建

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'android/**'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/android.yml'

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: 安装依赖并构建前端
        run: |
          npm ci
          npm run build

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v3

      - name: 安装 compileSdk 35 平台与构建工具
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v4

      - name: 同步到 Android 工程
        run: npx cap sync android

      - name: Gradle 构建 Debug 与 Release 包
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease

      - name: 重命名产物
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/debug/app-debug.apk "提词器-debug-$VERSION.apk"
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "提词器-release-unsigned-$VERSION.apk" || true
          ls -lh *.apk

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: |
            提词器-debug-*.apk
            提词器-release-unsigned-*.apk
          retention-days: 30
